# Daily full-catalogue scrape of every active magento shop.
# Runs 01:19 UTC.
name: scrape-magento

on:
  # Schedule switched on once the adapter has passed its --limit 20 tests on two shops.
  # schedule:
  #   - cron: '19 1 * * *'
  workflow_dispatch:
    inputs:
      shop:
        description: 'Only this shop slug (optional)'
        required: false
      limit:
        description: 'Stop each shop after N products (testing)'
        required: false

concurrency:
  group: scrape-magento
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      ALERT_FROM: ${{ vars.ALERT_FROM }}
      SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - name: Scrape
        env:
          SHOP_INPUT: ${{ inputs.shop }}
          LIMIT_INPUT: ${{ inputs.limit }}
        run: |
          ARGS="--adapter magento"
          if [ -n "$SHOP_INPUT" ]; then ARGS="--shop $SHOP_INPUT"; fi
          if [ -n "$LIMIT_INPUT" ]; then ARGS="$ARGS --limit $LIMIT_INPUT"; fi
          pnpm scrape $ARGS
