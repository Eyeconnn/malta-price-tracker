# Adaptive re-checks: re-reads products whose next_check_at has passed.
# Disabled until switched on: set the repository variable SCRAPE_DUE_ENABLED to true (planned for 1 Nov).
# Manual runs always work.
name: scrape-due

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: scrape-due
  cancel-in-progress: false

jobs:
  due:
    if: ${{ vars.SCRAPE_DUE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      ALERT_FROM: ${{ vars.ALERT_FROM }}
      SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm scrape-due
