# Daily full-catalogue scrape of every active woo shop.
# Runs 01:13 UTC. Gamebreaker (10 s gaps, ~41k products) sets the length.
name: scrape-woo

on:
  schedule:
    - cron: '13 1 * * *'
  workflow_dispatch:
    inputs:
      shop:
        description: 'Only this shop slug (optional)'
        required: false
      limit:
        description: 'Stop each shop after N products (testing)'
        required: false

concurrency:
  group: scrape-woo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed shops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm migrate && pnpm seed
      - name: Scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # product photos: small WebP copies to R2 (src/pipeline/images.ts)
          IMAGES_ENABLED: 'on'
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
          SHOP_INPUT: ${{ inputs.shop }}
          LIMIT_INPUT: ${{ inputs.limit }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # --runner cloud stays on every branch: shops marked local never run from GitHub
          ARGS="--runner cloud --adapter woo"
          if [ -n "$SHOP_INPUT" ]; then ARGS="--runner cloud --shop $SHOP_INPUT"; fi
          if [ -n "$LIMIT_INPUT" ]; then ARGS="$ARGS --limit $LIMIT_INPUT"; fi
          # the scheduled run is a backup for the dispatch from the PC at 02:30: skip shops already done
          if [ "$EVENT_NAME" = "schedule" ]; then ARGS="$ARGS --skip-done-hours 18"; fi
          pnpm scrape $ARGS
