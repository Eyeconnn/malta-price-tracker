# Nightly site build: turns the scraped prices into the public site's tables (site_products, shop_ratings).
# Started by scripts/run-local.ps1 after the local scrape. The cron is a backup that does nothing when a
# build already ran in the last 20 hours and no scrape finished or started since then (so a build that ran
# before the cloud scrapes finished is redone with their prices).
name: site-build

on:
  schedule:
    - cron: '55 4 * * *'
  workflow_dispatch:

concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_ARGS: ${{ github.event_name == 'schedule' && '--skip-if-built-hours 20' || '' }}
        run: pnpm migrate && pnpm site-build $SKIP_ARGS
