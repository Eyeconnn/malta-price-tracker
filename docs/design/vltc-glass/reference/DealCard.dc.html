<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deal card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bfg.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<article class="{{cls}}" aria-labelledby="{{titleId}}" ref="{{setEl}}" onMouseEnter="{{enter}}" onMouseLeave="{{leave}}" onClick="{{tap}}">
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute;"><filter id="bfg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="7" result="noise"></feTurbulence><feGaussianBlur in="noise" stdDeviation="2" result="soft"></feGaussianBlur><feDisplacementMap in="SourceGraphic" in2="soft" scale="42" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></svg>

<div class="prc-media">
<div class="prc-img" aria-hidden="true">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{icon}}"></path></svg>
<span class="t-lbl">Product photo</span>
</div>
<div class="prc-shade" aria-hidden="true"></div>
<span class="{{badgeCls}}">{{badge}}</span>
<button type="button" class="{{heartCls}}" aria-pressed="{{watching}}" aria-label="{{heartLabel}}" onClick="{{toggleWatch}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="{{heartFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
</button>
<sc-if value="{{c.bf}}" hint-placeholder-val="{{true}}"><span class="chip chip-bf prc-bf">Black Friday</span></sc-if>
</div>

<div class="prc-body">
<p class="prc-shop"><span class="logo" aria-hidden="true">{{c.initials}}</span>{{c.shop}}</p>
<h3 id="{{titleId}}" class="prc-name">{{c.title}}</h3>
<p class="prc-price"><span class="t-num" style="font-size: 26px; color: var(--accent);">{{c.priceTxt}}</span><sc-if value="{{c.hasWas}}" hint-placeholder-val="{{true}}"><s class="t-strike" style="font-size: 16px;"><span class="bfg-sr">Shop's was price </span>{{c.wasTxt}}</s></sc-if></p>
</div>

<div class="{{overlayCls}}">
<div class="prc-overlay-inner">
<div class="prc-step">
<h4 style="margin: 0 0 6px; font-size: 15px; font-weight: 700;">{{verdictTitle}}</h4>
<p class="t-hint" style="font-size: 13.5px; line-height: 1.5;">{{c.reason}}</p>
</div>
<div class="prc-step prc-facts">
<div class="prc-fact"><div style="font-weight: 700;">{{claimTxt}}</div><div class="t-hint">Shop's claim</div></div>
<div class="prc-fact"><div style="font-weight: 700; color: {{checkColor}};">{{checkTxt}}</div><div class="t-hint">Our check</div></div>
</div>
<div class="prc-step" style="display: flex; flex-direction: column; gap: 10px;">
<a class="btn btn-primary prc-btn" href="{{c.href}}" style="min-height: 48px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path></svg>See price history</a>
<a class="btn prc-btn" href="{{c.shopHref}}">View on {{c.shop}}</a>
</div>
</div>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"card":{"editor":null},"advanced":{"editor":"boolean","default":false},"$preview":{"width":320,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { watching: false, active: false, pop: 0 };
    this.uid = 'prc' + Math.random().toString(36).slice(2, 8);
    var self = this;
    this.touch = false;
    try { this.touch = window.matchMedia('(hover: none)').matches; } catch (e) {}
    // phones have no hover: a card opens by itself while it sits in the middle band of the screen
    this.setEl = function (el) {
      if (el === self.el) return;
      if (self.io) self.io.disconnect();
      self.el = el;
      if (!el || !self.touch || typeof IntersectionObserver === 'undefined') return;
      self.io = new IntersectionObserver(function (entries) {
        var on = !!(entries[0] && entries[0].isIntersecting);
        if (on !== self.state.active) self.setState({ active: on });
      }, { rootMargin: '-42% 0px -42% 0px', threshold: 0 });
      self.io.observe(el);
    };
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); }
  renderVals() {
    var self = this;
    var c = this.props.card || {
      title: 'Sony WH-1000XM6 Wireless Noise Cancelling Headphones', shop: 'Pixel Point', initials: 'PP', shopHref: '#', href: '#',
      priceTxt: '€359', wasTxt: '€399', hasWas: true, verdict: 'good', bf: true,
      reason: '€40 below its lowest price in the 24 days before 16 Nov (€399).', tag: { kind: 'good', from: '', to: '', label: '' }
    };
    var euros = function (t) { return Number(String(t || '').replace(/[^0-9.]/g, '')) || 0; };
    var p = euros(c.priceTxt), w = euros(c.wasTxt);
    var claimed = c.hasWas && w > p ? Math.round((w - p) / w * 100) : 0;
    var good = c.verdict === 'good';
    var label = c.tag && c.tag.label;
    var badge = good ? (claimed ? claimed + '% off, real deal' : 'Real deal')
      : label === 'WAS RAISED' ? 'Was price raised'
      : label === 'AVOID' ? 'Discount not real'
      : 'Price raised';
    // a simple outline picked from the title, standing in for the shop's product photo
    var t = (c.title || '').toLowerCase();
    var ICONS = {
      audio: 'M4 15v-3a8 8 0 0 1 16 0v3M3 14h4v7H3zM17 14h4v7h-4z',
      screen: 'M3 5h18v12H3zM8 21h8M12 17v4',
      phone: 'M7 2h10v20H7zM11 18h2',
      game: 'M6 9h12a4 4 0 0 1 0 8l-2-2H8l-2 2a4 4 0 0 1 0-8zM8 11v3M6.5 12.5h3M15 12h.01M17 13h.01',
      box: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10'
    };
    var icon = /headphone|airpods|earbud|speaker|flip/.test(t) ? ICONS.audio : /tv|laptop|monitor/.test(t) ? ICONS.screen : /iphone|galaxy|phone/.test(t) ? ICONS.phone : /playstation|switch|xbox/.test(t) ? ICONS.game : ICONS.box;
    return {
      c: c, icon: icon, titleId: this.uid + '-t',
      badge: badge, badgeCls: 'prc-badge ' + (good ? 'prc-badge-good' : 'prc-badge-bad'),
      watching: this.state.watching,
      heartCls: 'prc-heart' + (this.state.watching ? ' prc-heart-on' : '') + (this.state.pop % 2 ? ' prc-pop-b' : (this.state.pop ? ' prc-pop-a' : '')),
      heartFill: this.state.watching ? 'currentColor' : 'none',
      heartLabel: this.state.watching ? 'Stop watching this price' : 'Watch this price',
      toggleWatch: function () { self.setState({ watching: !self.state.watching, pop: self.state.pop + 1 }); },
      cls: 'prc tile glass-card' + (this.state.active ? ' prc-active' : ''),
      overlayCls: 'prc-overlay',
      enter: function () { if (!self.touch) self.setState({ active: true }); },
      leave: function () { if (!self.touch) self.setState({ active: false }); },
      // a tap on the card itself (not on its links or buttons) opens or closes it on a phone
      tap: function (e) {
        if (!self.touch) return;
        var t = e.target;
        while (t && t !== e.currentTarget) { if (t.tagName === 'A' || t.tagName === 'BUTTON') return; t = t.parentNode; }
        self.setState({ active: !self.state.active });
      },
      verdictTitle: good ? 'Why it is a good deal' : 'Why to avoid it',
      claimTxt: claimed ? claimed + '% off' : 'No discount',
      checkTxt: good ? 'Real deal' : 'Not real',
      checkColor: good ? 'var(--good)' : 'var(--bad)'
    };
  }
}
</script>
</body>
</html>
