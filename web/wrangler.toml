# Public Black Friday Guide (Cloudflare Worker: static web app + JSON API).
# Secrets: DATABASE_URL (read-only role dashboard_ro), REPORTER_DATABASE_URL (site_reporter),
# ADMIN_DATABASE_URL (site_admin), SITE_PASSWORD, ADMIN_PASSWORD, SITE_ORIGIN, IP_SALT, TURNSTILE_SECRET (optional).
# Build the assets first: `pnpm web:build` writes ../dist/web.
name = "bf-guide"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
# the Worker runs before every asset so private mode protects the HTML too
run_worker_first = true
